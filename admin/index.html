<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PowerPatch — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-logo">
      <div class="logo-mark">
      </div>
      <div class="logo-wordmark">LeakXpert™</strong></div>
    </div>

    <div class="sidebar-section-label">Main Menu</div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        Orders
        <span class="nav-count" id="navOrderCount">—</span>
      </a>
      <a href="#" class="nav-item nav-disabled">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
        </svg>
        Products
      </a>
      <a href="#" class="nav-item nav-disabled">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
        </svg>
        Customers
      </a>
      <a href="#" class="nav-item nav-disabled">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Analytics
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-inner">
        <div class="admin-avatar">A</div>
        <div class="admin-info">
          <div class="admin-name">Admin</div>
          <div class="admin-role">Super User</div>
        </div>
        <div class="admin-status-dot"></div>
      </div>
    </div>

  </aside>

  <!-- ═══ MOBILE TOPBAR ═══ -->
  <header class="topbar" id="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-brand">
      <div class="topbar-logo-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      PowerPatch Admin
    </div>
    <div style="width:36px"></div><!-- spacer -->
  </header>

  <!-- ═══ MAIN ═══ -->
  <main class="main-content">

    <!-- Page header -->
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-eyebrow">Dashboard</div>
        <h1 class="page-title">Orders</h1>
      </div>
      <div class="page-header-right">
        <button class="btn-refresh" id="refreshBtn" title="Reload orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- ── STAT CARDS ── -->
    <div class="stats-grid">

      <div class="stat-card stat-total">
        <div class="stat-icon-wrap stat-icon-default">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="totalOrders">—</div>
        </div>
        <div class="stat-progress">
          <div class="stat-progress-fill stat-fill-default" style="width:100%"></div>
        </div>
      </div>

      <div class="stat-card stat-pending">
        <div class="stat-icon-wrap stat-icon-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">Pending</div>
          <div class="stat-value stat-value-red" id="pendingOrders">—</div>
        </div>
        <div class="stat-progress">
          <div class="stat-progress-fill stat-fill-red" id="pendingBar" style="width:0%"></div>
        </div>
      </div>

      <div class="stat-card stat-active">
        <div class="stat-icon-wrap stat-icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">In Progress</div>
          <div class="stat-value stat-value-blue" id="activeOrders">—</div>
        </div>
        <div class="stat-progress">
          <div class="stat-progress-fill stat-fill-blue" id="activeBar" style="width:0%"></div>
        </div>
      </div>

      <div class="stat-card stat-revenue">
        <div class="stat-icon-wrap stat-icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value stat-value-green" id="totalRevenue">—</div>
        </div>
        <div class="stat-progress">
          <div class="stat-progress-fill stat-fill-green" style="width:100%"></div>
        </div>
      </div>

    </div>

    <!-- ── FILTERS ── -->
    <div class="filters-bar">
      <div class="search-wrapper">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or phone…" autocomplete="off"/>
      </div>
      <div class="filter-chips">
        <button class="filter-btn active" data-filter="all">All Orders</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="confirmed">Confirmed</button>
        <button class="filter-btn" data-filter="shipped">Shipped</button>
        <button class="filter-btn" data-filter="delivered">Delivered</button>
      </div>
    </div>

    <!-- ── ORDERS TABLE ── -->
    <div class="orders-card">
      <div class="orders-table-header">
        <span>Customer</span>
        <span>Contact</span>
        <span>Items</span>
        <span>Total</span>
        <span>Status</span>
        <span>Date</span>
        <span>Update Status</span>
      </div>
      <div id="orders-container">
        <div class="loading-state">
          <div class="spinner"></div>
          <span>Loading orders…</span>
        </div>
      </div>
    </div>

  </main>

  <!-- ═══ MODAL ═══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="orderModal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title">Order Details</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>

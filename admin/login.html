<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PowerPatch Admin Login</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #393185;
      --red: #ea1f22;
      --bg: #f8fafc;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 22px;
      color: var(--blue);
    }

    .logo span {
      color: var(--red);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text);
      font-size: 20px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(57,49,133,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #ea1f22, #c01a1c);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(234,31,34,0.3);
    }

    .error {
      margin-top: 10px;
      font-size: 13px;
      color: var(--red);
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">PowerPatch</span></div>
  <h2>Admin Login</h2>

  <div class="input-group">
    <input type="email" id="email" placeholder="Email">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

  <div class="error" id="errorMsg"></div>

  <div class="footer">
    Secure Admin Access
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWHLZ1qRzDQIEpBZ0TZSzt_cdTx27toG4",
  authDomain: "powerpatch-7d9ae.firebaseapp.com",
  projectId: "powerpatch-7d9ae",
  storageBucket: "powerpatch-7d9ae.firebasestorage.app",
  messagingSenderId: "370451089713",
  appId: "1:370451089713:web:42109b8cd0084da3184810",
  measurementId: "G-ZG4LY5TX42"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("errorMsg");

  errorBox.textContent = "";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "/admin";
  } catch (err) {
    errorBox.textContent = err.message;
  }
};
</script>

</body>
</html>
